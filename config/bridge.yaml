# Bridge between Gazebo topics and ROS 2 topics for sub1.
# Every ROS topic of this sub starts with /sub1/. For a second sub, copy the
# whole list into a new file and replace sub1 with sub2.

# --- Sensors: Gazebo -> ROS ---
- ros_topic_name: "/sub1/odom"          # position, direction, speed (z = minus depth)
  gz_topic_name: "/model/sub1/odometry"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS
- ros_topic_name: "/sub1/sonar"         # 9 distances ahead
  gz_topic_name: "/world/lrauv_demo/model/sub1/link/base_link/sensor/sonar/scan"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS
- ros_topic_name: "/sub1/altimeter"     # distance down to the seabed
  gz_topic_name: "/world/lrauv_demo/model/sub1/link/base_link/sensor/altimeter/scan"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS
- ros_topic_name: "/sub1/imu"           # tilt and turning speed
  gz_topic_name: "/world/lrauv_demo/model/sub1/link/base_link/sensor/imu/imu"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: GZ_TO_ROS
- ros_topic_name: "/sub1/camera"        # front camera picture
  gz_topic_name: "/world/lrauv_demo/model/sub1/link/base_link/sensor/camera/image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

# --- Thrusters: ROS -> Gazebo (force in newtons) ---
- ros_topic_name: "/sub1/thrust/rear_left"
  gz_topic_name: "/model/sub1/joint/rear_left_joint/cmd_thrust"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ
- ros_topic_name: "/sub1/thrust/rear_right"
  gz_topic_name: "/model/sub1/joint/rear_right_joint/cmd_thrust"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ
- ros_topic_name: "/sub1/thrust/vert_front"
  gz_topic_name: "/model/sub1/joint/vert_front_joint/cmd_thrust"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ
- ros_topic_name: "/sub1/thrust/vert_back"
  gz_topic_name: "/model/sub1/joint/vert_back_joint/cmd_thrust"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ
